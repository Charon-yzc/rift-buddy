<script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"url":"https://www.leagueoflegends.com/en-us/news/game-updates/league-of-legends-patch-26-21-notes/","locale":"en-us","title":"League of Legends Patch 26.21 Notes","blades":[{"type":"articleMasthead","publishDate":"2026-10-20T18:00:00.000Z"},{"fragmentId":"26.21","palette":"palette2","richText":{"type":"html","body":"<header class=\"header-primary\"><h2 id=\"patch-midpatch-updates\">Mid-Patch Updates</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><h3 class=\"change-detail-title\" id=\"patch-october-22,-2026-updates\">October 22, 2026 Updates</h3><h4 class=\"change-detail-title\">Varus</h4><blockquote class=\"blockquote context\"><p>This patch we did work to adjust Varus' top and bottom power skew, which involved shifting the balance between his Q and W for laning. While the resulting changes have seemed promising, we unfortunately added a major bug to his Q during this work, causing it to no longer deal reduced damage to subsequent targets. We are fixing that bug, and compensating with a buff.</p></blockquote><ul><li>Passive Bonus AD and AP on Kill/Takedown: (1.1 per 10% AS) as bonus AD and AP ⇒ 1.4 per 10% AS</li><li>Q Minimum Damage: 50 - 230 ⇒ 50 - 250</li></ul></div></div></div><header class=\"header-primary\"><h2 id=\"patch-patch-highlights\">Patch Highlights</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><p><a class=\"skins cboxElement\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4c49249ce9a22c0bf9eab3760b0e342f79251e1f-1920x1080.png\"><span class=\"content-border\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4c49249ce9a22c0bf9eab3760b0e342f79251e1f-1920x1080.png\"></span></a></p><p>Prestige True Damage Know My Name Ekko, True Damage Know My Name Akali, True Damage Know My Name Qiyana, True Damage Know My Name Senna, and True Damage Know My Name Yasuo will be available October 21, 2026.</p></div></div></div><header class=\"header-primary\"><h2 id=\"patch-replay-download-limits\">Replay Download Limits</h2></header><div class=\"content-border\"><div class=\"white-stone accent-before\"><div><blockquote class=\"blockquote context\"><p>Starting during Patch 26.21, replay downloads will be limited to 10 per hour. You will still be able to download your own replays, as well as replays from your friends and other players.<br><br>This change is necessary to prevent large-scale abuse of downloaded replays by bad actors using vibecoded apps to scrape thousands upon thousands of replays. We opted for a time-based limit to still allow creators to make content, while preventing mass exploitative downloads. We’ll continue to monitor how many replays are downloaded to ensure players have access to this important feature while preventing clear misuse.</p></blockquote></div></div></div><header class=\"header-primary\"><h2 id=\"patch-champions\">Champions</h2></header><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://leagueoflegends.com/en-us/champions/azir/\"><img src=\"https://am-a.akamaihd.net/image?f=https://ddragon.leagueoflegends.com/cdn/16.18.1/img/champion/Azir.png\"></a></p><h3 class=\"change-title\" id=\"patch-azir\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.leagueoflegends.com/en-us/champions/azir/\">Azir</a></h3><blockquote>Editorial context omitted.</blockquote><hr class=\"divider\"><h4 class=\"change-detail-title\">Base Stats</h4><ul><li><strong>Mana Growth</strong>: 40/Level ⇒ <strong>50/Level</strong></li></ul></div></div></div><div class=\"content-border\"><div class=\"patch-change-block white-stone accent-before\"><div><p><a class=\"reference-link\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"h
