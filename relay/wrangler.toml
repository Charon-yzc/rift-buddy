#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker + Durable Object relay for 开黑搭子 rooms.
# Deploy: cd relay && npx wrangler deploy
# Free plan works as-is (SQLite-backed Durable Objects).
name = "rift-buddy-room"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]
