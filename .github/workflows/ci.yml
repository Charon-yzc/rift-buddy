name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify development Electron runtime
        run: pnpm exec electron --version
      - name: Run regression tests
        run: pnpm test
      - name: Check source and bundled data
        run: pnpm check
      - name: Validate combination catalog
        run: pnpm catalog:validate
      - name: Package Windows application
        run: pnpm package
      - name: Verify package contents
        run: node scripts/inspect-package.mjs --verify-current
      - name: Check selection, loading and in-game transitions
        run: node scripts/smoke-package-game-transition.mjs
      - name: Check guide interaction and live-data fallback
        run: node scripts/smoke-package-guide-input.mjs
      - name: Check live situation advice and explanations
        run: node scripts/smoke-package-live-situation.mjs
      - name: Check build choices and combination database
        run: node scripts/smoke-package-database.mjs
      - name: Check saved preparations and member configurations across restarts
        run: node scripts/smoke-package-preparations.mjs
      - name: Check public-opponent plans and duo phases in packaged windows
        run: node scripts/smoke-package-matchups.mjs
      - name: Check accepted mechanism plans across member guides and restarts
        run: node scripts/smoke-package-cooperation.mjs
      - name: Check locked cross-lane plans and complete late-item choices across restarts
        run: node scripts/smoke-package-cooperation.mjs --cross-lane
      - name: Check public picks and source refresh invalidate recommendations
        run: node scripts/smoke-package-recommendation-fit.mjs
      - name: Check standalone connection helper
        run: node scripts/smoke-package-helper.mjs
      - name: Check application lifecycle
        run: node scripts/smoke-package-lifecycle.mjs
