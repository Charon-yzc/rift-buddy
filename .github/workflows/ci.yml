name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify development Electron runtime
        run: pnpm exec electron --version
      - name: Run regression tests
        run: pnpm test
      - name: Check source and bundled data
        run: pnpm check
      - name: Validate combination catalog
        run: pnpm catalog:validate
      - name: Package Windows application
        run: pnpm package
      - name: Verify package contents
        run: node scripts/inspect-package.mjs --verify-current
      - name: Check real main and sidebar synchronization and idle-game resources
        run: node scripts/smoke-package-dual-windows.mjs
      - name: Check accepted trio hover, explicit preparation and cross-window configuration
        run: |
          node scripts/smoke-package-party-preparation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-party-preparation.mjs --unadopted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-party-preparation.mjs --loading-transition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-party-preparation.mjs --loading-new-game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-party-preparation.mjs --custom
      - name: Check compact complete gear, conditional alternatives and jungle routes
        run: |
          node scripts/smoke-package-useful-guide.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-useful-guide.mjs --dpi-1
      - name: Check six compact choices at common main and sidebar sizes
        run: pnpm exec electron scripts/smoke-selection-layout.cjs
      - name: Check selection, loading and in-game transitions
        run: node scripts/smoke-package-game-transition.mjs
      - name: Check manual positions, preparation writes and explicit version refresh
        run: node scripts/smoke-package-journey.mjs
      - name: Check interleaved configuration and guide edits preserve accepted fields
        run: |
          foreach ($delay in @(0,180,500)) {
            $env:RIFT_GUIDE_SYNC_DELAY = "$delay"
            node scripts/smoke-package-user-flow.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check guide interaction and live-data fallback
        run: node scripts/smoke-package-guide-input.mjs
      - name: Check live situation advice and explanations
        run: node scripts/smoke-package-live-situation.mjs
      - name: Check build choices and combination database
        run: node scripts/smoke-package-database.mjs
      - name: Check arbitrary-role personal pairs, editor scrolling and saved member guides
        run: node scripts/smoke-package-catalog.mjs
      - name: Check saved preparations and member configurations across restarts
        run: node scripts/smoke-package-preparations.mjs
      - name: Check in-guide late choices, support reservation, favorites and restart
        run: node scripts/smoke-package-guide-continuation.mjs
      - name: Check favorites preserve current public picks, manual positions and member choices
        run: node scripts/smoke-package-favorite-context.mjs
      - name: Check poke friends, distinct third-member duties and saved tactical choices
        run: |
          node scripts/smoke-package-cooperation.mjs --poke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --poke-guard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check prepared D/F spells, compact controls and saved member choices
        run: node scripts/smoke-package-summoners.mjs
      - name: Check backup merge capacity and explicit rune writes in isolated clients
        run: |
          node scripts/smoke-package-import.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-state-transaction.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-rune-replacement.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check creative action order preserves saved members and configurations
        run: node scripts/smoke-package-creative-plan-continuity.mjs --reordered
      - name: Check public-opponent plans and duo phases in packaged windows
        run: |
          node scripts/smoke-package-matchups.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-role-preparation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-role-preparation.mjs --matchup-choices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check public-opponent conditions preserve accepted team order and own skill gates
        run: node scripts/smoke-package-matchups.mjs --team-order
      - name: Check explicit opponent sources, independent statistics and saved member choices
        run: node scripts/smoke-package-opponent-builds.mjs
      - name: Check accepted mechanism plans across member guides and restarts
        run: node scripts/smoke-package-cooperation.mjs
      - name: Check concrete three-person and full-party plans, first-screen actions and attribute preparation
        run: |
          node scripts/smoke-package-cooperation.mjs --specific
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --gragas-relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --party-four
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --party-five
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check frozen curated plans, selectable party routes and sidebar adoption
        run: |
          node scripts/smoke-package-curated-plan.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --routes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --ball-trio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --duo-stages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --custom-runes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check four/five-member poke, protection routes and separate pair evidence
        run: |
          node scripts/smoke-package-curated-plan.mjs --tactics-four
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --tactics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --independent-four
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-curated-plan.mjs --independent-five
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check locked cross-lane plans and complete late-item choices across restarts
        run: node scripts/smoke-package-cooperation.mjs --cross-lane
      - name: Check retained pair order and third-member follow-ups across restarts
        run: node scripts/smoke-package-cooperation.mjs --retained-pair
      - name: Check ordinary locked-friend recommendations without hero pools
        run: node scripts/smoke-package-cooperation.mjs --locked-friends
      - name: Check shared resource and meeting plans without invented control across restarts
        run: |
          node scripts/smoke-package-cooperation.mjs --shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --growth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check role statistics and broad skill cooperation across saved member guides
        run: node scripts/smoke-package-cooperation.mjs --adaptive-data
      - name: Check expanded cooperation and sidebar preview choices before accepting a plan
        run: node scripts/smoke-package-cooperation.mjs --coverage
      - name: Check shooter marks and farming friends across saved preparations
        run: |
          node scripts/smoke-package-cooperation.mjs --shooters
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-cooperation.mjs --farming
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check member statistics refresh, offline caches and quest-only synchronization
        run: node scripts/smoke-package-pair-refresh.mjs
      - name: Check sidebar choices survive uncached sources and individual edits
        run: node scripts/smoke-package-companion-workflow.mjs
      - name: Check public picks and source refresh invalidate recommendations
        run: node scripts/smoke-package-recommendation-fit.mjs
      - name: Check partial settings recovery and locked friend continuity
        run: node scripts/smoke-package-state-recovery.mjs
      - name: Check own selectable heroes, public draft restrictions and locked favorites
        run: node scripts/smoke-package-pick-eligibility.mjs
      - name: Check standalone connection helper
        run: node scripts/smoke-package-helper.mjs
      - name: Check application lifecycle
        run: node scripts/smoke-package-lifecycle.mjs
      - name: Check application update discovery, verified download and install handoff
        run: |
          node scripts/smoke-package-app-update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-package-app-update.mjs --handoff
