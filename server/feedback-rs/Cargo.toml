[package]
name = "rift-buddy-feedback"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
